name: Keep Streamlit app awake
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:          # adds a manual "Run workflow" button
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Visit the app and wake it if asleep
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright
          URL = "https://ciso-patch-advisor.streamlit.app/"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(5000)
              button = page.get_by_role("button", name="Yes, get this app back up!")
              if button.count() > 0:
                  button.click()
                  print("App was asleep: clicked wake-up")
                  page.wait_for_timeout(60000)
              else:
                  print("App was awake: visit registered")
                  page.wait_for_timeout(30000)
              browser.close()
          EOF
